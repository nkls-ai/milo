[project]
name = "milo"
version = "0.1.0"
description = "Milo brain: voice, memory, harness adapters and heartbeat"
authors = [
    { name = "NiklasDob", email = "niklas.dobberstein02@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mlx-whisper>=0.4.3",
    "numpy>=2.5.4",
    "sounddevice>=0.5.6",
    "sqlite-vec>=0.1.9",
    "tokenizers>=0.23.3",
    "tomlkit>=0.14.0",
]

[project.scripts]
milo = "milo.server:main"

[project.optional-dependencies]
omnivoice = [
    "omnivoice>=0.2.1",
    "soundfile>=0.14.0",
]

[build-system]
requires = ["uv_build>=0.8.18,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
