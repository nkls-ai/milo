# Milo configuration. Restart Milo after editing (menu bar > Restart brain).
# Milo's Settings window changes some of these for you and keeps your comments.
#
# Every swappable part has `use = "<name>"` and a table `[<part>.<name>]` with that
# implementation's options. Unknown keys are an error, so typos fail loudly. A part whose `use`
# is left out (commented below) gets this computer's own engine: on a Mac everything runs here
# (Whisper, OmniVoice, the Mac's apps); elsewhere hearing and voice are ElevenLabs for now.

[chat]
# The fast model Milo talks with. It streams, so he starts speaking after the first clause.
use = "claude_live"
# Start a fresh conversation after this many seconds without talking (also reloads memory).
conversation_idle_reset_s = 600
# Typing in an earlier conversation in the Milo window picks it up again: Milo gets a recap of it of at
# most this many tokens.
recap_tokens = 600
# How Milo tells you about work his helpers do: "quiet" (only the small birds and the Milo window),
# "bubble" (short notes in the bubble) or "chatty" (he also says them). Results and questions always
# come through. Changes take effect without a restart.
updates = "bubble"
# Talk over Milo to stop him, without the talk key. The mic listens while he speaks, and his own
# voice is filtered out of it. Best with headphones; try it with the speakers and see.
voice_barge_in = false
# A short "hm" when an answer is slow to start, so a pause never sounds like he didn't hear.
backchannels = true
# Calendar entries, to-dos, notes, timers, mail drafts, shortcuts and the music right away, without a
# helper, and today's and tomorrow's calendar at hand. Each still follows [connections] below.
quick_actions = true

[chat.claude_live]
binary = ""                       # empty: PATH, then ~/.local/bin
# claude-haiku-5-5 answers faster and steadier: its first sentence is ready after about 1.3 s, Sonnet's
# after 2 to 4 s. Real work goes to the helpers either way. claude-sonnet-5-5 for deeper small talk.
model = "claude-haiku-5-5"
effort = "low"

# Or any OpenAI-style chat API: use = "openai_compat" in [chat] and this table without the #s.
# OpenAI, OpenRouter (base_url = "https://openrouter.ai/api/v1"), Ollama ("http://localhost:11434/v1")
# or LM Studio ("http://localhost:1234/v1"). The key goes alone in ~/Milo/secrets/<key_ref>; local
# servers need none.
# [chat.openai_compat]
# base_url = "https://api.openai.com/v1"
# model = "gpt-5-mini"
# key_ref = "openai.key"
# cache_control = false           # true for Claude or Gemini models through OpenRouter, so the prompt is cached
# images = true                   # false for a model that can't see screenshots

[harness]
# The agent that does real work (files, research, multi-step tasks) when the chat model hands one off.
use = "codex"                     # codex | claude
# Helpers that work at the same time, each its own worker. Work on the screen goes one at a time.
max_helpers = 3

[harness.codex]
binary = ""                       # empty: PATH, then ChatGPT.app's bundled codex
model = ""
light_model = "gpt-6-luna"        # for simple helpers off the screen (a calendar read, a mail search); "" uses model
reasoning_effort = "low"
sandbox = "workspace-write"       # or read-only. Helpers write only ~/Milo/work, never Milo's own files
timeout_s = 180

[harness.claude]
binary = ""
model = ""
light_model = ""                  # for simple helpers off the screen, e.g. "claude-haiku-5-5"
permission_mode = "acceptEdits"
timeout_s = 180

[connections]
# Lets Milo's helper use your calendar, reminders, mail, notes, shortcuts and files.
# Mail is only ever drafted, never sent. Switch off anything he shouldn't touch.
enabled = true
# use = "mac"                     # left out: this computer's apps (mac on a Mac, none elsewhere yet)
                                  # fake: made-up data in ~/Milo/fake, for trying things out
calendar = true
reminders = true
mail = true
notes = true
shortcuts = true
files = true
music = true                      # play, pause and skip the music
contacts = true                   # find who you mean in your contacts, for a message or a call
messages = true                   # text someone when you ask; he asks before every message
calls = true                      # call someone when you ask; he asks before every call
music_app = ""                    # where "play Taylor Swift" plays: "Music", "Spotify", or "" for the one
                                  # already running, else Music
volume = true                     # set the sound volume
brightness = true                 # make the screen brighter or dimmer

[connections.mac]
files_scope = "~"                 # files outside this folder are never searched or read

[weather]
# The forecast Milo answers "do I need an umbrella tomorrow?" from, read about every 45 minutes.
# The place's name goes to Open-Meteo (free, no account); nothing else about you does.
enabled = true
# use = "open_meteo"              # left out: Open-Meteo
place = ""                        # a city ("Berlin", "Portland, Oregon") or "52.52,13.41"; empty: your time zone's city
units = "metric"                  # "metric" (°C, km/h) or "imperial" (°F, mph)

[home]
# Lights, plugs, scenes, heating and blinds just happen, with Undo. Locks, garage doors and the alarm ask first.
# Setup: docs/setup/home.md.
use = "auto"                      # auto: Home Assistant when it has a url below, else Apple Home on a Mac
                                  # home_assistant, apple_home or none to pick one
# [home.home_assistant]
# url = "http://homeassistant.local:8123"
# key_ref = "home_assistant.token" # a long-lived token, alone in ~/Milo/secrets/home_assistant.token

[home.apple_home]
folder = "Milo Home"              # the Shortcuts folder with your Home scenes and devices

[approvals]
# A question stays open until you answer it, and is said once more after reask_s. A task waiting for it
# pauses as "waiting for your answer" and goes on after a yes. timeout_s > 0: no answer in that time means no.
timeout_s = 0
reask_s = 20
speak = true                      # say the question out loud, besides showing it
# How often Milo asks before he acts (ADR 22, 23): "auto" (what you asked for needs no question), "task" (one
# Allow covers the rest of that task in that app) or "step" (every step that would ask). In auto mode a page or a
# calendar entry you ask for just happens even after he read a mail or the screen; "task" and "step" ask first when
# outside text could have put it there. In every mode he stops
# and asks for what can't be undone, for sending and sharing, and for buying or anything with money (only a
# click on Yes counts for money). Passwords, card numbers and security settings he never touches.
ask = "auto"
# Apps you chose "Allow always" for. Settings › "How often Milo asks" lists them, with Remove.
allowed_apps = []

[approvals.levels]
# read: just do it. change: do it, it shows in the Milo window. ask_first: ask yes or no first. never: refuse.
read = "read"                     # looking things up
draft = "read"                    # mail drafts: nothing leaves your Mac
change = "change"                 # calendar entries, reminders, notes
trash = "change"                  # to the Trash or Recently Deleted: can be undone
install = "change"                # programs Milo installs; asks unless you named it yourself
send = "ask_first"
share = "ask_first"               # anything going to another person
delete = "ask_first"              # for good: can't be undone
discard = "ask_first"             # Don't Save
overwrite_file = "ask_first"      # replacing a file on disk
buy = "ask_first"                 # buy and money: never less than ask_first, and only a click on Yes counts
money = "ask_first"               # payments, transfers
shortcut = "ask_first"            # your own shortcuts can do any of the above
lock = "ask_first"                # locks, garage doors and the alarm at home
# password and security are always "never".

[messages]
# Reach Milo on this Mac from your phone, through a chat app. Setup: docs/setup/messages.md.
# Make a bot with @BotFather in Telegram, put its token in the token file below, switch this on and
# restart Milo, then message the bot and send it the code Milo shows here.
enabled = false
use = "telegram"                  # telegram | imessage (experimental, needs Full Disk Access)
max_per_minute = 10               # messages Milo answers per minute; more are dropped
# With no mouse or keyboard use for this long, Milo's questions go to your phone, and only your phone
# can answer them. While you are away, changes to this file are put back.
away_after_min = 5
question_timeout_s = 150          # how long a question on your phone waits; no answer means no
brief_at = ""                     # "07:30": today's calendar, reminders and helpers every morning. "" is off.
max_file_mb = 45                  # Milo sends you a file only after your yes, up to this size

[messages.telegram]
token_file = "secrets/telegram-token"   # in ~/Milo, readable by you only: chmod 600

[messages.imessage]
handle = ""                       # your own phone number or Apple ID email, the chat Milo uses

[logging]
content = false                   # true puts what you say and Milo's answers in brain.log. Debugging only.
max_mb = 2
keep = 3

[stt]
# Dictation, and talking to Milo unless `talk` is set. Left out: mlx_whisper (on this computer) on a Mac,
# elevenlabs elsewhere (needs the key, see [tts.elevenlabs]).
# use = "mlx_whisper"
# A cloud service that listens along while you talk to Milo, so the text is ready 0.2 s after you let go
# instead of after a full pass here. "elevenlabs" sends what you say to Milo to ElevenLabs (it needs the key,
# see [tts.elevenlabs]). Empty: nothing you say leaves this Mac. If the service can't be reached, Milo
# transcribes here and says so.
talk = ""
cloud_dictation = false           # true sends dictation there too (not with stream = "type")

[stt.elevenlabs]
languages = ["de", "en"]          # the languages you speak, so it tells them apart
keyterms = ["Milo"]               # names it should get right; costs a little more

[stt.mlx_whisper]
model = "mlx-community/whisper-large-v3-turbo"
preview_model = "mlx-community/whisper-base-mlx"  # live words while you speak (~0.15 s a pass); "" uses model
language = ""                     # empty: auto-detect. "de" or "en" to pin it.
vocabulary = "Milo, Codex, Claude" # names Whisper should spell right

[tts]
# pocket: on this Mac, Kyutai's Pocket TTS on the CPU, piece by piece, about 7x faster than real time, English
# and German. omnivoice: on this Mac, a cloned voice on the GPU, slower. elevenlabs: a cloud voice that speaks a
# whole answer as one, starting about 0.2 s after his first sentence is written; needs a key in
# ~/Milo/secrets/elevenlabs.key. say: the Mac's own voice. Left out: pocket on a Mac, elevenlabs elsewhere.
# use = "pocket"
# Used if `use` fails to load, and while elevenlabs can't be reached. It loads only when needed: "say" at
# once, "omnivoice" sounds more like Milo but takes a while and a few GB of memory the first time.
# "" for none. Left out: say on a Mac, none elsewhere.
# fallback = "say"

[tts.elevenlabs]
# One of your account's voices. Callum (the default) is young and a little higher; others for Milo, higher
# to lower: Harry SOYHLrjzK2X1ezoPC6cr, Charlie IKne3meq5aSn9XLyUdCD, Chris iP95p4xoKVk53GoZ742B,
# Will bIHbv24MWmeRgasZH58o.
voice_id = "N2lVS1w4EtoT3dr4eOWO"
model = "eleven_v4_turbo"         # the fastest (about 0.1 s). eleven_flash_v2_5 is the older one; eleven_v4 is too slow to talk
stability = 0.5                   # lower: livelier, higher: steadier
similarity_boost = 0.75           # eleven_flash_v2_5 and other v2.5 models only
speed = 1.0                       # 0.7 to 1.2, v2.5 models only
language = ""                     # empty: follows the text, German and English mixed

[tts.pocket]
voice = "stuart_bell"             # a premade voice: stuart_bell, peter_yearsley, bill_boerst, alba, marius, ...
english = "english"               # the model for English; "" for none. english_7m_2026-10 is smaller and faster
german = "german"                 # the model for German; "" for none

[tts.omnivoice]
device = ""                       # empty: the GPU it finds (mps on a Mac, cuda), else cpu
# Milo always speaks with one cloned voice. On first start it is designed from `instruct` with
# `voice_seed` and saved to ~/Milo/state/voice/. Delete that folder to design a new one.
instruct = "male, young adult, high pitch"
voice_seed = 7
ref_audio = ""                    # your own 2-5 s clip instead (overrides instruct)
ref_text = ""                     # its transcript; empty: Whisper transcribes it
# Diffusion steps per piece. On an M3 with the cloned voice: 6 = 0.6-0.8x real time and as clear as 8; 5 drops words.
steps = 6

[tts.say]
voice = ""

[audio]
use = "sounddevice"

[audio.sounddevice]
input_device = ""                 # empty: system default
output_device = ""

[dictation]
use = "fillers"                   # fillers | plain
keep_history = true               # log dictations to dictation-history.jsonl
# What happens while you speak, for dictation and for talking to Milo. Menu bar > Dictation style switches it.
#   "preview": the words show next to Milo; the text is pasted the moment you let go.
#   "type":    each phrase is typed into the app at the pause after it (talking to Milo works like preview).
#   "off":     nothing while you speak; the whole recording is transcribed when you let go (slower).
stream = "preview"
# When you fix a word Milo pasted (he wrote "Cloud Code", you make it "Claude Code"), he notices it and spells it
# your way next time. He reads the pasted text in that field for up to 45 s, never password fields, and keeps
# the fixes in dictionary.md, which you can edit. Settings > Dictation switches it too.
learn = true

[dictation.fillers]
languages = ["en", "de"]

[heartbeat]
enabled = true
tick_s = 30
# Hard cap on harness calls the heartbeat may make per day. 0 = it never calls the LLM.
llm_calls_per_day = 0
min_gap_between_nudges_min = 20
max_nudges_per_hour = 2
# Never speak a nudge while one of these apps is frontmost.
quiet_apps = ["zoom.us", "FaceTime", "Microsoft Teams", "Webex", "Keynote"]
rules = ["reminders", "morning", "late_night", "welcome_back", "focus_break"]

[heartbeat.morning]
after_hour = 5
before_hour = 12

[heartbeat.late_night]
from_hour = 1
until_hour = 5

[heartbeat.welcome_back]
away_min = 30

[heartbeat.focus_break]
after_min = 90

[heartbeat.reminders]
grace_hours = 12

[ui]
dictate_key = "fn"                # fn | right_option | right_command | right_control
talk_key = "right_option"
hands_free_max_s = 300            # double-tap a key for hands-free; it stops by itself after this
voice = true                      # false: answers show in the bubble without being said out loud
hide_after_s = 15                 # Milo leaves the screen after this many seconds with nothing going on; 0: he stays
# Ask Milo about the selection, or the front window if nothing is selected. "" turns it off.
whats_this_key = "ctrl+option+m"
# Start or stop meeting notes by hand, e.g. for a Discord call Milo didn't notice. "" turns it off.
meeting_key = "ctrl+option+n"

[routines]
# Recipes for work you want done again ("remember how to do this, call it the Monday report"), kept as
# Markdown in ~/Milo/routines. Schedules run on the heartbeat, without a model call to decide.
enabled = true
max_runs_per_day = 6              # scheduled runs a day, all routines together; asking yourself isn't capped
grace_hours = 4                   # a run the Mac slept through runs at wake if at most this late, else he tells you

[hands]
# Let the worker agent use the Mac: read windows, press buttons, type and click. Needs Accessibility,
# and Screen Recording for screenshots. Touching the mouse or keyboard, or esc, stops it at once.
# Risky steps (Send, Delete, every script) ask first, like [approvals], and wait its timeout_s.
enabled = true
applescript = true                # let it drive scriptable apps (Finder, Numbers, Safari) with AppleScript
show_window = true                # bring the window he works in to the front, so you see it; false: he works behind

[memory]
# Milo remembers conversations, tasks and what you tell him, and each turn brings along only what
# matters to it. Everything stays on this Mac in ~/Milo/memory. See "What Milo knows" in the menu bar.
enabled = true
recall_tokens = 800               # how much memory goes along with each turn, at most (about 4 characters a token)
# mlx_e5 (a small model, 140 MB, finds meaning) | hash (no model, finds words). Left out: mlx_e5 on a Mac,
# hash elsewhere. Changing it rebuilds the search index on the next start.
# embedder = "mlx_e5"
dictations = false                # also remember what you dictate into other apps
# Once a night, while the Mac is idle and plugged in, Milo sums up the day, learns new facts and fixes
# old ones, and writes memory/journal/<day>.md. That costs a worker call or two a day.
consolidate = true
consolidate_calls_per_day = 2     # hard cap; 0 turns it off

[memory.mlx_e5]
model = "intfloat/multilingual-e5-small"
device = "gpu"                    # gpu | cpu

[meetings]
# When Milo notices a call (Zoom, Teams, Meet, FaceTime, Slack huddles): "ask" asks once whether to take notes,
# "calendar" takes notes without asking when your calendar has a meeting now (and asks otherwise), "off" never
# asks. "Take meeting notes" in the menu bar works either way. Notes go to ~/Milo/meetings/.
auto = "ask"
keep_audio = false                # keep the recording after the notes are written
diarizer = "sherpa_onnx"          # tells the other people apart; "" labels them all "Others"
regroup = "pyannote"              # sorts out who said what over the whole call after Stop; "" keeps the live speakers
offer_reminders = true            # after the call, offer to put your to-dos into Reminders
offer_mail = true                 # after the call, offer a follow-up mail draft
end_after_s = 30                  # notes stop this long after the call ends
always = ""                       # apps he takes notes in without asking, like "Zoom, Microsoft Teams"
never = ""                        # apps he never asks about, like "WhatsApp"

[meetings.sherpa_onnx]
match = 0.6                       # how alike two stretches of speech must sound to count as one person

# pyannote's community-1 pipeline (the brain's `pyannote` extra), once per call after Stop. Its weights are gated on
# Hugging Face: accept the terms on huggingface.co/pyannote/speaker-diarization-community-1, then download them once
# into model_dir. Without them Milo keeps the speakers he found during the call. Its usage reporting stays off.
[meetings.pyannote]
model_dir = "~/.cache/milo/models/pyannote-community-1"
device = "auto"                   # auto (the GPU), mps, cuda or cpu
