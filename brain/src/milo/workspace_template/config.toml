# Milo configuration. Restart Milo after editing (menu bar > Restart brain).
#
# Every swappable part has `use = "<name>"` and a table `[<part>.<name>]` with that
# implementation's options. Unknown keys are an error, so typos fail loudly.

[chat]
# The fast model Milo talks with. It streams, so he starts speaking after the first clause.
use = "claude_live"
# Start a fresh conversation after this many seconds without talking (also reloads memory).
conversation_idle_reset_s = 600

[chat.claude_live]
binary = ""                       # empty: PATH, then ~/.local/bin
model = "claude-sonnet-5-5"       # claude-haiku-5-5 is cheaper and about as fast
effort = "low"

[harness]
# The agent that does real work (files, research, multi-step tasks) when the chat model hands one off.
use = "codex"                     # codex | claude

[harness.codex]
binary = ""                       # empty: PATH, then ChatGPT.app's bundled codex
model = ""
reasoning_effort = "low"
sandbox = "workspace-write"
timeout_s = 180

[harness.claude]
binary = ""
model = ""
permission_mode = "acceptEdits"
timeout_s = 180

[connections]
# Lets Milo's helper use your calendar, reminders, mail, notes, shortcuts and files.
# Mail is only ever drafted, never sent. Switch off anything he shouldn't touch.
enabled = true
use = "mac"                       # mac | fake (made-up data in ~/Milo/fake, for trying things out)
calendar = true
reminders = true
mail = true
notes = true
shortcuts = true
files = true

[connections.mac]
files_scope = "~"                 # files outside this folder are never searched or read

[approvals]
# How long Milo waits for your yes. No answer means no.
timeout_s = 60
speak = true                      # say the question out loud, besides showing it

[approvals.levels]
# read: just do it. change: do it, it shows in the Milo window. ask_first: ask yes or no first. never: refuse.
read = "read"                     # looking things up
draft = "read"                    # mail drafts: nothing leaves your Mac
change = "change"                 # calendar entries, reminders, notes
send = "ask_first"
share = "ask_first"               # anything going to another person
delete = "ask_first"
buy = "ask_first"
shortcut = "ask_first"            # your own shortcuts can do any of the above
# password, money and security are always "never".

[logging]
content = false                   # true puts what you say and Milo's answers in brain.log. Debugging only.
max_mb = 2
keep = 3

[stt]
use = "mlx_whisper"

[stt.mlx_whisper]
model = "mlx-community/whisper-large-v3-turbo"
preview_model = "mlx-community/whisper-base-mlx"  # live words while you speak (~0.15 s a pass); "" uses model
language = ""                     # empty: auto-detect. "de" or "en" to pin it.
vocabulary = "Milo, Codex, Claude" # names Whisper should spell right

[tts]
use = "omnivoice"                 # omnivoice | say
fallback = "say"                  # used if `use` fails to load

[tts.omnivoice]
device = "mps"
# Milo always speaks with one cloned voice. On first start it is designed from `instruct` with
# `voice_seed` and saved to ~/Milo/state/voice/. Delete that folder to design a new one.
instruct = "male, young adult, high pitch"
voice_seed = 7
ref_audio = ""                    # your own 2-5 s clip instead (overrides instruct)
ref_text = ""                     # its transcript; empty: Whisper transcribes it
# Diffusion steps per piece. On an M3 with the cloned voice: 6 = 0.6-0.8x real time and as clear as 8; 5 drops words.
steps = 6

[tts.say]
voice = ""

[audio]
use = "sounddevice"

[audio.sounddevice]
input_device = ""                 # empty: system default
output_device = ""

[dictation]
use = "fillers"                   # fillers | plain
keep_history = true               # log dictations to dictation-history.jsonl
# While you speak: "off" transcribes on release. "preview" shows the words next to Milo and pastes one
# final pass on release. "type" pastes each phrase at the pause after it (earlier phrases stay as typed).
stream = "preview"

[dictation.fillers]
languages = ["en", "de"]

[heartbeat]
enabled = true
tick_s = 30
# Hard cap on harness calls the heartbeat may make per day. 0 = it never calls the LLM.
llm_calls_per_day = 0
min_gap_between_nudges_min = 20
max_nudges_per_hour = 2
# Never speak a nudge while one of these apps is frontmost.
quiet_apps = ["zoom.us", "FaceTime", "Microsoft Teams", "Webex", "Keynote"]
rules = ["reminders", "morning", "late_night", "welcome_back", "focus_break"]

[heartbeat.morning]
after_hour = 5
before_hour = 12

[heartbeat.late_night]
from_hour = 1
until_hour = 5

[heartbeat.welcome_back]
away_min = 30

[heartbeat.focus_break]
after_min = 90

[heartbeat.reminders]
grace_hours = 12

[ui]
dictate_key = "fn"                # fn | right_option | right_command | right_control
talk_key = "right_option"
hands_free_max_s = 300            # double-tap a key for hands-free; it stops by itself after this
character = "pip"                 # pip (the bird) | classic (the purple robot)
# Ask Milo about the selection, or the front window if nothing is selected. "" turns it off.
whats_this_key = "ctrl+option+m"

[hands]
# Let the worker agent use the Mac: read windows, press buttons, type and click. Needs Accessibility,
# and Screen Recording for screenshots. Touching the mouse or keyboard, or esc, stops it at once.
# Risky steps (Send, Delete, every script) ask first, like [approvals], and wait its timeout_s.
enabled = true
applescript = true                # let it drive scriptable apps (Finder, Numbers, Safari) with AppleScript

[memory]
# Milo remembers conversations, tasks and what you tell him, and each turn brings along only what
# matters to it. Everything stays on this Mac in ~/Milo/memory. See "What Milo knows" in the menu bar.
enabled = true
recall_tokens = 800               # how much memory goes along with each turn, at most (about 4 characters a token)
embedder = "mlx_e5"               # mlx_e5 (a small model, 140 MB, finds meaning) | hash (no model, finds words)
dictations = false                # also remember what you dictate into other apps
# Once a night, while the Mac is idle and plugged in, Milo sums up the day, learns new facts and fixes
# old ones, and writes memory/journal/<day>.md. That costs a worker call or two a day.
consolidate = true
consolidate_calls_per_day = 2     # hard cap; 0 turns it off

[memory.mlx_e5]
model = "intfloat/multilingual-e5-small"
device = "gpu"                    # gpu | cpu

