# The homepage (site/) on GitHub Pages at https://nkls-ai.github.io/milo/, with install.sh beside it so the
# one-line install has a short address. Runs only while the repo is public: Pages on a private repo needs a paid
# plan, and a skipped run beats a red one. Once public: Settings › Pages › Source: GitHub Actions.
name: site

on:
  push:
    branches: [main]
    paths: ["site/**", "install.sh", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run build
        env:
          SITE_URL: https://nkls-ai.github.io
          SITE_BASE: /milo
      - run: cp ../install.sh dist/install.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
